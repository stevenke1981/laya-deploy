[project]
name = "laya-deploy"
version = "0.1.0"
description = "Run convaiinnovations/laya (System-1 decision model) locally on GPU, with an HTTP decisions API and a laya-native decision mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Steven" }]
# 核心只有 HTTP 服務；模型推論（torch + transformers，約 3 GB）放在 model extra
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
model = ["laya>=0.4.4,<0.5", "torch>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
laya-deploy = "laya_deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Windows/Linux 取 CUDA 版 torch；PyPI 上的 Windows torch 只有 CPU 版。
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
